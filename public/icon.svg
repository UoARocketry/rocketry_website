<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0a0a0a"/>
  <!-- Rotated 45deg so the rocket runs along the square's diagonal, which is
       the longest axis available and lets the shape read larger at 16-32px. -->
  <g transform="translate(256 256) rotate(45) scale(1.12) translate(-256 -256)">
    <!-- flame -->
    <path d="M212 378 L256 474 L300 378 Z" fill="#F2A03D"/>
    <path d="M231 378 L256 436 L281 378 Z" fill="#FFD79A"/>
    <!-- fins -->
    <path d="M198 312 L146 396 L198 380 Z" fill="#C25632"/>
    <path d="M314 312 L366 396 L314 380 Z" fill="#C25632"/>
    <!-- body -->
    <rect x="198" y="186" width="116" height="196" fill="#F2F2F2"/>
    <!-- nose cone -->
    <path d="M256 52 L314 190 L198 190 Z" fill="#E2542B"/>
    <!-- window -->
    <circle cx="256" cy="258" r="26" fill="#0a0a0a"/>
  </g>
</svg>
