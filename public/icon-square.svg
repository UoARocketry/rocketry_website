<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed square variant of icon.svg, used only to generate
       apple-touch-icon.png: iOS applies its own rounded mask and renders
       transparent corners as black, so this one must not be pre-rounded.
       Keep the artwork in sync with icon.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d1401"/>
      <stop offset="55%" stop-color="#7d2d03"/>
      <stop offset="100%" stop-color="#cf6107"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5662e"/>
      <stop offset="100%" stop-color="#e94925"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="100%" stop-color="#fff2c2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) rotate(45) scale(1.12) translate(-256 -256)">
    <path d="M214 380 L256 486 L298 380 Z" fill="url(#flame)"/>
    <path d="M198 306 L142 400 L198 382 Z" fill="#1c1d1c"/>
    <path d="M314 306 L370 400 L314 382 Z" fill="#1c1d1c"/>
    <rect x="198" y="188" width="116" height="194" fill="#212123"/>
    <path d="M256 46 L314 192 L198 192 Z" fill="url(#nose)"/>
  </g>
</svg>
