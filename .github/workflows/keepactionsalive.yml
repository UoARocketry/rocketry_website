name: GitHub Workflow Immortality

on:
  schedule:
    # Run once a month on the 1st day at 00:20 UTC
    - cron: '20 0 1 * *'
  workflow_dispatch: {} # Allows you to manually run the workflow from the GitHub UI

jobs:
  keepalive:
    name: GitHub Workflow Immortality
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Keep cronjob based triggers of GitHub workflows alive
        # Pinned to a commit, not the mutable @v1 tag. This step is handed a PAT
        # with Administration write on the repo, so if the tag were re-pointed at
        # compromised code that token would go with it. Bump deliberately after
        # reading the diff: 39378c2 is v1.2.0.
        uses: PhrozenByte/gh-workflow-immortality@39378c27dcacbc17e6fbf83057d1fc40c574000d
        with:
          secret: ${{ secrets.PERSONAL_ACCESS_TOKEN_KEEP_ALIVE }}
          repos: ${{ github.repository }} # Keeps the current repository alive
