name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate DB environment
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${DIRECT_URL:-}" || -n "${DATABASE_URL:-}" ]]; then
            echo "Database build env is configured."
            exit 0
          fi

          echo "::error::Missing DATABASE_URL/DIRECT_URL in workflow context."

          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "::error::This run is from a fork PR; repository secrets are not exposed to pull_request workflows."
          else
            echo "::error::Add DATABASE_URL or DIRECT_URL as repository secrets (or vars), or configure the job environment that contains them."
          fi

          exit 1

      - name: Build
        run: npm run build
